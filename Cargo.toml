[workspace]
members = [
    "dds",
    "dds_derive",
    "dds_gen",
    "interoperability_tests",
    "shapes_demo",
    "shapes_demo/android",
    "fuzz",
    "bindings/python",
    "bindings/c",
    "nostd_test_project",
    "micro",
    "micro/interface",
    "micro/micro_app",
]
default-members = [
    "dds",
    "dds_derive",
    "dds_gen",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
version = "0.17.0"
authors = [
    "Joao Rebelo <jrebelo@s2e-systems.com>",
    "Stefan Kimmer <skimmer@s2e-systems.com>",
    "Pierre Martinet <pmartinet@s2e-systems.com>",
]
homepage = "https://s2e-systems.com/products/dust-dds"
repository = "https://github.com/s2e-systems/dust-dds.git"
keywords = ["dds", "rtps", "middleware", "network", "udp"]
categories = ["api-bindings", "network-programming"]

[workspace.dependencies]
md5 = { version = "0.7.0", default-features = false }

[profile.micro-dev]
inherits="dev"
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-
