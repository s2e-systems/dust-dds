[package]
name = "native_reader"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
dust_dds = { path = "../../../../dds" }
dust_dds_derive = { path = "../../../../dds_derive" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync", "net", "fs", "io-util"] }
tokio-tungstenite = "0.26"
webrtc = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
